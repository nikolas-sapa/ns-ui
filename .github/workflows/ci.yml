name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    env:
      # The `playwright` package downloads browsers on install. CI only needs
      # to typecheck and build; `npm run verify` is a local gate that requires
      # a running server, so skip the ~400MB download.
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # The build scripts are TypeScript run directly by node
          # (`node scripts/build-index.ts`), which needs Node's native type
          # stripping. That is on by default from Node 22.18 / 24.x.
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Build registry
        run: npm run registry:build

      - name: Typecheck
        run: npm run typecheck

      - name: Build site
        run: npm run build

  dco:
    name: dco
    # Only meaningful on a PR: the repo's own pre-Phase-B history carries no
    # Signed-off-by trailer, so this would fail on every commit if it also
    # ran on `push` to main (see the trigger above).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Default checkout is depth-1 of the PR's synthetic merge commit —
          # that enumerates zero real commits and this job would pass having
          # checked nothing. Full history so the base..head range below is real.
          fetch-depth: 0

      - name: Check Signed-off-by on every commit
        # Base/head SHAs are 40-char hex from the event payload, not free text,
        # but pass them through env rather than interpolating into the script
        # directly — the safe pattern regardless of how trusted the value is.
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          range="${BASE_SHA}..${HEAD_SHA}"
          # `--no-merges`: a merge commit has no author asserting anything —
          # it is a graph operation. GitHub's own "Update branch" button
          # creates one, and it cannot carry a sign-off, so checking them made
          # the button unusable and blocked otherwise-signed PRs. The DCO
          # covers authored work, which is exactly the non-merge commits.
          commits=$(git log --no-merges --format=%H "$range")
          count=$(echo "$commits" | grep -c . || true)
          if [ "$count" -eq 0 ]; then
            echo "DCO check examined 0 commits (bad range: $range) — failing rather than passing on nothing checked."
            exit 1
          fi
          fail=0
          for sha in $commits; do
            if ! git log -1 --format=%B "$sha" | grep -qi '^Signed-off-by: .\+ <.\+>$'; then
              echo "::error::commit $sha is missing a 'Signed-off-by' trailer. Run: git rebase --signoff ${BASE_SHA}"
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            exit 1
          fi
          echo "$count non-merge commit(s) checked, all signed off."
